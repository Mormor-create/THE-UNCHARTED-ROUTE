{% extends "admin/base.html" %}

{% block title %}Edit Traveller | The Uncharted Route{% endblock %}

{% block content %}
<div class="mx-auto max-w-5xl space-y-6">
    <div>
        <a href="{{ url_for('admin_booking_travellers.detail', traveller_id=traveller.id) }}"
           class="text-sm font-medium text-route-forest hover:text-route-gold">
            ← Traveller Details
        </a>
        <h1 class="mt-3 text-3xl font-bold tracking-tight text-route-forest">Edit Traveller</h1>
        <p class="mt-2 text-sm text-route-muted">{{ traveller.full_name }}</p>
    </div>

    <form method="POST" class="rounded-2xl border border-route-sand bg-white p-6 shadow-sm md:p-8">
        {{ form.hidden_tag() }}
        {% include "admin/booking_travellers/_form_fields.html" %}
    </form>
</div>
{% endblock %}
